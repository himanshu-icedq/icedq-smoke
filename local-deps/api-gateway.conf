# Local API gateway — mirrors prod ingress path routing when there is no
# unified host. Browser-facing UIs substitute HTTP_API_URL with this port;
# nginx forwards to the correct Java service on the compose network.
#
# Upstreams use run-* container names (icedq-*-smoke) on icedq-smoke-deps_default.

server {
  listen 9080;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 30s;
  proxy_read_timeout 300s;

  # --- connection-repo (:9200) — paths from helm connection chart ---
  location ~ ^/api/v1/(connectors|connections|oauth|databases|schemas|tables|columns|secret|internal/secret|vault|files|projects|reports|data|source-definitions|layouts|sources|metadata|ai/internal) {
    proxy_pass http://127.0.0.1:9200;
  }
  location ~ ^/api/v2/connections {
    proxy_pass http://127.0.0.1:9200;
  }
  location ~ ^/api/v1/bi/ {
    proxy_pass http://127.0.0.1:9200;
  }
  location = /conn-api {
    proxy_pass http://127.0.0.1:9200;
  }

  # --- workflow / rule-repo (:9300) — paths from helm workflow chart ---
  location ~ ^/api/v1/(parameters|functions|rules|checks|file-schema|internal/rules|internal/file-schema|internal/degree-of-parallelism|custom-classes|custom-functions|exports|download|imports|internal/imports|workflows|internal/workflows|tasks|taskruns|workflowruns|workflow|exceptions|profiles) {
    proxy_pass http://127.0.0.1:9300;
  }
  location ~ ^/api/v2/exceptions {
    proxy_pass http://127.0.0.1:9300;
  }
  location ~ ^/(ruler-api|workflow-orchestration-api|workflow)(/|$) {
    proxy_pass http://127.0.0.1:9300;
  }

  # --- admin-service (:9100) — everything else under /api/ ---
  # Running on Windows host (outside compose), not as icedq-admin-smoke container.
  location /api/ {
    proxy_pass http://127.0.0.1:9100;
  }
}
